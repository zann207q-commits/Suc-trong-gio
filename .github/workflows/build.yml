
name: Build Kaze

on:
  workflow_dispatch:
  push:
    paths:
      - "kaze-donut-base-finding-updated.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q kaze-donut-base-finding-updated.zip -d source

      - name: Find Gradle project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts -o -name gradlew

      - name: Build project
        shell: bash
        run: |
          set -e
          WRAPPER=$(find source -type f -name gradlew -print -quit)
          if [ -n "$WRAPPER" ]; then
            chmod +x "$WRAPPER"
            cd "$(dirname "$WRAPPER")"
            ./gradlew build --no-daemon
          else
            echo "Không tìm thấy Gradle Wrapper."
            exit 1
          fi

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kaze-build
          path: source/**/build/libs/*.jar
          if-no-files-found: error
