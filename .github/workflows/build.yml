name: Build Anubis

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        run: |
          VERSION=8.10.2
          curl -fsSL "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' ! -name 'Anubis_GitHub_AutoBuild_Kit.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root. Upload your Anubis source ZIP to the root of the repository."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          echo "Extracted files:"
          find unpacked -maxdepth 4 -type f | head -80

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle or build.gradle.kts found inside the ZIP."
            echo "This ZIP may contain only decompiled source without a valid build project."
            exit 1
          fi
          BUILD_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project at $BUILD_DIR"

      - name: Build project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon build --stacktrace

      - name: Upload JAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anubis-build-output
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: warn
          
