
name: Build Anubis

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        run: |
          VERSION=8.10.2
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

      - name: Extract source
        run: |
          test -f source.zip
          mkdir -p unpacked
          unzip -q source.zip -d unpacked

      - name: Build project
        shell: bash
        run: |
          BUILD_FILE="$(find unpacked -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Không tìm thấy build.gradle"
            exit 1
          fi

          BUILD_DIR="$(dirname "$BUILD_FILE")"
          echo "Building in: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle --no-daemon build --stacktrace

      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anubis-build-output
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: warn
