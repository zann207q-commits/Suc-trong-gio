name: Build Anubis

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Unzip project
        run: |
          ZIP="$(ls -1 *.zip | head -n 1)"
          echo "Using $ZIP"
          mkdir -p unpacked
          unzip -q -o "$ZIP" -d unpacked

      - name: Build
        run: |
          BUILD_FILE="$(find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Anubis-jar
          path: unpacked/**/build/libs/*.jar
