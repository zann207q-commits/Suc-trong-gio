name: Build Anubis

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 8.14
        run: |
          VERSION=8.14
          curl -fsSL "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Không tìm thấy ZIP source ở thư mục gốc repository."
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

      - name: Build project
        shell: bash
        run: |
          BUILD_FILE="$(find unpacked -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Không tìm thấy build.gradle hoặc build.gradle.kts bên trong ZIP."
            echo "Nội dung đầu thư mục đã giải nén:"
            find unpacked -maxdepth 3 -type f | head -100
            exit 1
          fi
          BUILD_DIR="$(dirname "$BUILD_FILE")"
          echo "Building project in: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle --version
          gradle --no-daemon build --stacktrace

      - name: Upload JAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anubis-build-output
          path: unpacked/**/build/libs/*.jar
          if-no-files-found: warn
